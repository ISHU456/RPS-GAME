<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME | ISHU ANAND MALVIYA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="game">
    <section>
        <div >
            <div class="box1">
                <h1 style="text-align: center;">ROCK - PAPER - SCISSORS</h1>
                <button class="modebtn" id="mode">🌙 Dark Mode</button>
            </div>
            
            <div >
                <div style="margin-top: 60px;"> <h1 style="text-align: center;">SELECT YOUR OPTION : </h1></div>
                <div class="container">
                    <button class="mybutton" id="btn" onclick="playGame('rock')">✊</button>
                <button class="mybutton" id="btn" onclick="playGame('paper')">🖐️</button>
                <button class="mybutton" id="btn" onclick="playGame('scissors')">✌️</button>
                </div>
                
            </div>
            <div class="sec">
                <div id="playerDisplay">PLAYER:</div>
                <div id="computerDisplay">COMPUTER: </div>
            </div>
            <div class="sec">
                <div id="resultDisplay">IT's A TIE</div>
            </div>
            <div class="scoreBox">
                <div class="scoreDisplay">Player Score:
                    <span id="playerScoreDisplay">0</span>
                </div>
                <div class="scoreDisplay">Computer Score:
                    <span id="computerScoreDisplay">0</span>
                </div>
            </div>
            

        </div>
        <marquee behavior="" scrollamount= "10"direction="left" style="color: rgb(9, 255, 0);font-size: 15px;">YOU CAN GIVE YOUR FEEDBACK HERE <a href="https://www.linkedin.com/in/ishu-anand-malviya-435440258/overlay/contact-info/"><span style="color:rgb(255, 0, 0);text-decoration: none;"> CLICK HERE</span></a></marquee>
    </section>
    
    <script>
        const mode =document.getElementById("mode");
        const body = document.getElementById("game");

        mode.addEventListener("click",event=>{
            if(mode.textContent === "🌙 Dark Mode"){
            body.style.color="white";
            mode.style.backgroundColor ="white";
            mode.style.color = "black"
            mode.textContent = "☀️ Light Mode";
            body.style.backgroundColor= "black";

        }
        else{
        
            body.style.color="black";
            mode.style.backgroundColor ="black";
            mode.style.color = "white"
            mode.textContent = "🌙 Dark Mode";
            body.style.backgroundColor= "white";
        }
    });

    //GAME LOGIC

    const  choice = ["rock","paper","scissors"];
    const playerDisplay = document.getElementById("playerDisplay");
    const computerDisplay = document.getElementById("computerDisplay");
    const resultDipslay = document.getElementById("resultDisplay");
    const playerScoreDisplay = document.getElementById("playerScoreDisplay");
    const computerScoreDisplay = document.getElementById("computerScoreDisplay");
    let playerScore = 0;
    let computerScore = 0;

    function playGame(playerChoice){
        const computerChoice = choice[Math.floor(Math.random()*3)];
        let result ="";
        if(playerChoice === computerChoice){
            result ="IT's A TIE";
        }
        else{
            switch(playerChoice){
                case "rock":
                    result = (computerChoice === "scissors") ? "YOU WIN!":"YOU LOSE!";
                    break;
                case "scissors":
                    result = (computerChoice === "paper") ? "YOU WIN!":"YOU LOSE!";
                    break;
                case "paper":
                    result = (computerChoice === "rock") ? "YOU WIN!":"YOU LOSE!";
                    break;
            }
        }
        playerDisplay.textContent=`PLAYER: ${playerChoice}`;
        computerDisplay.textContent =`COMPUTER: ${computerChoice}`;
        resultDipslay.textContent = result;
        resultDipslay.classList.remove("greenText","redText");

        switch(result){
            case "YOU WIN!":
                resultDipslay.classList.add("greenText");
                playerScore++;
                playerScoreDisplay.textContent = playerScore;
                break;
            case "YOU LOSE!":
                resultDipslay.classList.add("redText");
                computerScore++;
                computerScoreDisplay.textContent = computerScore;
                break;
        }

        if playerScore ==5{
            document.write("YOU WIN");
        }
        else{
            document.write("YOU LOSE");
        }

    }

    </script>
</body>
</html>
